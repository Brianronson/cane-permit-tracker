<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cane Permit Tracker</title>
<meta name="description" content="Angata Sugar Mills — field capture to harvest permit and zoning">
<meta name="theme-color" content="#1B2A1E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin=""></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1EA;
  --card:#FFFFFF;
  --card-2:#F6F8F3;
  --line:#D6DCD0;
  --line-strong:#B9C2B2;
  --ink:#1B2A1E;
  --ink-2:#4A5A4D;
  --ink-3:#7C8A7E;
  --cane:#2E7D4F;
  --cane-ink:#FFFFFF;
  --cane-soft:#DDEFE3;
  --amber:#B8701A;
  --amber-soft:#F7E9D2;
  --teal:#1F6F78;
  --teal-soft:#D7EBED;
  --blue:#2F5F9E;
  --blue-soft:#DCE6F5;
  --red:#B23A2E;
  --red-soft:#F6DEDA;
  --grey:#6B736C;
  --grey-soft:#E4E7E2;
  --header:#1B2A1E;
  --header-ink:#F2F5EE;
  --focus:#2E7D4F;
  --rail:#CBD3C6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121813;
    --card:#1A221C;
    --card-2:#212B23;
    --line:#2C372E;
    --line-strong:#3E4B40;
    --ink:#E6ECE3;
    --ink-2:#AEBBB0;
    --ink-3:#7F8C81;
    --cane:#4FA86F;
    --cane-ink:#0E1A11;
    --cane-soft:#1F3A28;
    --amber:#E0A04A;
    --amber-soft:#3C2E18;
    --teal:#5FB7C0;
    --teal-soft:#193538;
    --blue:#7FA5DE;
    --blue-soft:#1C2A3F;
    --red:#E0766A;
    --red-soft:#3F2320;
    --grey:#9AA39B;
    --grey-soft:#2A322B;
    --header:#0D120E;
    --header-ink:#E6ECE3;
    --focus:#4FA86F;
    --rail:#3A463C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121813;
  --card:#1A221C;
  --card-2:#212B23;
  --line:#2C372E;
  --line-strong:#3E4B40;
  --ink:#E6ECE3;
  --ink-2:#AEBBB0;
  --ink-3:#7F8C81;
  --cane:#4FA86F;
  --cane-ink:#0E1A11;
  --cane-soft:#1F3A28;
  --amber:#E0A04A;
  --amber-soft:#3C2E18;
  --teal:#5FB7C0;
  --teal-soft:#193538;
  --blue:#7FA5DE;
  --blue-soft:#1C2A3F;
  --red:#E0766A;
  --red-soft:#3F2320;
  --grey:#9AA39B;
  --grey-soft:#2A322B;
  --header:#0D120E;
  --header-ink:#E6ECE3;
  --focus:#4FA86F;
  --rail:#3A463C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;min-height:100%;
  background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25}
h1{font-size:18px}
h2{font-size:20px;margin-bottom:4px}
h3{font-size:15px;margin-bottom:8px}
p{margin:0 0 10px}
a{color:var(--cane)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13px}

/* header */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:9;
  background:var(--header);color:var(--header-ink);
  display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:52px;
}
.top .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.top .brand .mark{width:28px;height:28px;border-radius:7px;background:var(--cane);display:grid;place-items:center;flex:none}
.top .brand .mark svg{width:18px;height:18px}
.top .brand .sub{font-size:12px;opacity:.7;display:block}
.top .who{display:flex;align-items:center;gap:8px;min-width:0}
.top .who img{width:28px;height:28px;border-radius:50%;flex:none}
.top .who .n{font-size:13px;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who .r{font-size:11px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}

/* tabs */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:9;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.tabs button{
  flex:1;background:none;border:0;padding:9px 4px 8px;color:var(--ink-3);
  font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;
  border-top:2px solid transparent;margin-top:-1px;
}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--cane);border-top-color:var(--cane)}
nav.tabs button .b{position:absolute;margin-left:22px;margin-top:-4px;background:var(--amber);color:#fff;font-size:10px;padding:0 5px;border-radius:9px;line-height:16px;min-width:16px;text-align:center}
nav.tabs button{position:relative}

main{max-width:1040px;margin:0 auto;padding:16px 16px 92px}
@media (min-width:860px){
  nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:4px;padding:0 16px}
  nav.tabs button{flex:0 0 auto;flex-direction:row;padding:12px 14px;font-size:14px;border-top:0;border-bottom:2px solid transparent;margin:0}
  nav.tabs button.on{border-bottom-color:var(--cane)}
  nav.tabs button .b{position:static;margin:0 0 0 4px}
  main{padding:24px 24px 60px}
}

/* cards & layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card.flat{background:var(--card-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid{display:grid;gap:12px}
@media (min-width:640px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:1fr 1fr 1fr}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
@media (min-width:640px){.stats{grid-template-columns:repeat(6,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font-size:24px;font-weight:600;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink-2);margin-top:2px}
.stat.hi{border-color:var(--cane);background:var(--cane-soft)}
.stat.hi .v{color:var(--cane)}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line-strong);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:8px;font-weight:500;min-height:40px;
}
.btn:hover{background:var(--card-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--cane);border-color:var(--cane);color:var(--cane-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.warn{color:var(--amber);border-color:var(--amber)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.linkish{background:none;border:0;color:var(--cane);padding:0;font-weight:500;text-decoration:underline;text-underline-offset:3px}
:where(button,input,select,textarea,a):focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:500;color:var(--ink-2)}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{
  background:var(--card);border:1px solid var(--line-strong);border-radius:8px;
  padding:10px 12px;min-height:42px;width:100%;
}
.field textarea{min-height:70px;resize:vertical}
.field.err input,.field.err select,.field.err textarea{border-color:var(--red)}
.field .hint{font-size:12px;color:var(--ink-3)}
.field .errmsg{font-size:12px;color:var(--red)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.check input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--cane)}
.section{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.section .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.section h3{margin:0;font-size:16px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:640px){.photos{grid-template-columns:repeat(3,1fr)}}
.photo{border:1px dashed var(--line-strong);border-radius:10px;background:var(--card-2);aspect-ratio:4/3;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;gap:6px}
.photo.has{border-style:solid}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:5px 8px;display:flex;justify-content:space-between;align-items:center}
.photo .cap button{background:none;border:0;color:#fff;text-decoration:underline;font-size:12px;padding:0}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo.err{border-color:var(--red)}
.photo svg{width:26px;height:26px;stroke:var(--ink-3);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.photo .t{font-size:13px;font-weight:500}
.sig{border:1px solid var(--line-strong);border-radius:10px;background:#fff;height:170px;touch-action:none;display:block;width:100%}
.sigwrap{position:relative}
.sigwrap .ghost{position:absolute;left:12px;bottom:10px;font-size:12px;color:#9AA39B;pointer-events:none}
.sigwrap .clr{position:absolute;right:8px;top:8px}
.terms{background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.55;max-height:220px;overflow:auto}
.terms b{font-weight:600}
.submitbar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 4px;margin-top:14px;display:flex;gap:10px}
@media (min-width:860px){.submitbar{bottom:0}}

/* status */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:14px;padding:2px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-red{background:var(--red-soft);color:var(--red)}
.t-blue{background:var(--blue-soft);color:var(--blue)}
.t-teal{background:var(--teal-soft);color:var(--teal)}
.t-green{background:var(--cane-soft);color:var(--cane)}
.t-grey{background:var(--grey-soft);color:var(--grey)}

/* the rail: 4 stops of the permit journey */
.rail{display:flex;align-items:center;gap:0;margin:6px 0}
.rail .stop{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;min-width:0}
.rail .stop .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--rail);background:var(--card);z-index:1}
.rail .stop .lbl{font-size:11px;color:var(--ink-3);margin-top:5px;text-align:center;white-space:nowrap}
.rail .stop::before{content:"";position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--rail)}
.rail .stop:first-child::before{display:none}
.rail .stop.done .dot{background:var(--cane);border-color:var(--cane)}
.rail .stop.done::before{background:var(--cane)}
.rail .stop.done .lbl{color:var(--ink)}
.rail .stop.cur .dot{background:var(--card);border-color:var(--cane);box-shadow:0 0 0 3px var(--cane-soft)}
.rail .stop.cur .lbl{color:var(--cane);font-weight:600}
.rail .stop.halt .dot{background:var(--red);border-color:var(--red)}
.rail .stop.halt .lbl{color:var(--red)}
.rail.mini .lbl{display:none}
.rail.mini{width:96px;margin:0}
.rail.mini .stop .dot{width:10px;height:10px}
.rail.mini .stop::before{top:4px}

/* entry rows */
.list{display:flex;flex-direction:column;gap:8px}
.erow{
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer;text-align:left;width:100%;color:var(--ink)
}
.erow:hover{border-color:var(--line-strong)}
.erow .name{font-weight:600;font-size:15px}
.erow .meta{font-size:13px;color:var(--ink-2)}
.erow .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.erow .permit{font-size:13px;color:var(--teal);font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line-strong);border-radius:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:180px}
.search input{width:100%;background:var(--card);border:1px solid var(--line-strong);border-radius:8px;padding:9px 12px;min-height:40px}

/* detail */
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
@media (max-width:480px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:640px){.gallery{grid-template-columns:repeat(4,1fr)}}
.gallery figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card-2)}
.gallery figure img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#fff}
.gallery figcaption{font-size:12px;padding:6px 8px;color:var(--ink-2)}
.hist{list-style:none;margin:0;padding:0;font-size:13.5px}
.hist li{display:grid;grid-template-columns:118px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .when{color:var(--ink-3);font-size:12.5px}
.note{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:10px 12px;font-size:14px}
.note.red{background:var(--red-soft);color:var(--red)}
.note.green{background:var(--cane-soft);color:var(--cane)}
.note.blue{background:var(--blue-soft);color:var(--blue)}
.banner{background:var(--amber-soft);color:var(--amber);padding:10px 16px;font-size:14px;text-align:center}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center
}
.toast.show{opacity:1}
@media (min-width:860px){.toast{bottom:28px}}
.spin{width:18px;height:18px;border:2px solid var(--line-strong);border-top-color:var(--cane);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.toast{transition:none}}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th,table.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl th{color:var(--ink-2);font-weight:500;font-size:13px}
.rolepick{display:flex;flex-wrap:wrap;gap:6px 14px}
.rolepick label{display:flex;gap:6px;align-items:center;font-size:14px}
.rolepick input{accent-color:var(--cane);width:17px;height:17px}
.people{display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card-2);flex-wrap:wrap}
.person img{width:30px;height:30px;border-radius:50%}
.person .pn{font-weight:500;min-width:140px}
.pill{display:inline-block;background:var(--grey-soft);color:var(--ink-2);border-radius:12px;padding:1px 8px;font-size:12px;margin-right:4px}
.center{text-align:center;padding:40px 16px;color:var(--ink-2)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink-2);padding:0;margin-bottom:12px;font-weight:500}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ===== v2 additions ===== */
.top .who{cursor:pointer;background:none;border:0;color:inherit;padding:4px 6px;border-radius:8px;text-align:left}
.top .who:hover{background:rgba(255,255,255,.08)}
.top .who .av{width:30px;height:30px;border-radius:50%;background:var(--cane);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.acct{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:30;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:220px;padding:6px}
.acct button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:7px;color:var(--ink);font-size:14px}
.acct button:hover{background:var(--card-2)}
.acct .hd{padding:8px 12px 6px;font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--line);margin-bottom:4px}
.acct .hd b{display:block;color:var(--ink);font-size:14px;font-weight:600}

.login{max-width:420px;margin:28px auto}
.login .card{padding:22px}
.login h2{margin-bottom:4px}
.login .mark{width:44px;height:44px;border-radius:11px;background:var(--cane);display:grid;place-items:center;margin-bottom:14px}
.login .mark svg{width:26px;height:26px}
.login .foot{text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:16px}
.pw{position:relative}
.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--cane);font-size:13px;font-weight:500;padding:6px 8px}
.setupnote{max-width:640px;margin:28px auto}
code.k{background:var(--card-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13px}

/* map */
.map{height:340px;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--card-2);position:relative;z-index:0}
@media (min-width:860px){.map{height:420px}}
.map.err{border-color:var(--red)}
.map.ro{height:260px}
.mapbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.mapbar .btn.on{background:var(--cane);border-color:var(--cane);color:var(--cane-ink)}
.maphint{font-size:12.5px;color:var(--ink-2);margin:4px 0 8px}
.leaflet-container{font:inherit}
.vtx{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #2E7D4F;box-shadow:0 1px 4px rgba(0,0,0,.4);margin:-8px 0 0 -8px}
.vtx.first{border-color:#B8701A}
.cbcpin{background:#1F6F78;color:#fff;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:600;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35);transform:translate(-50%,-50%)}
.cbcpin.near{background:#B8701A}
.leaflet-control-attribution{font-size:9px}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
@media (min-width:640px){.sum{grid-template-columns:repeat(4,1fr)}}
.sum .s{background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.sum .s .v{font-size:17px;font-weight:600}
.sum .s .l{font-size:11.5px;color:var(--ink-3)}
.zone{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:7px;background:var(--teal);color:#fff;font-weight:700;font-size:15px;padding:0 8px}
.zone.out{background:var(--red)}
.stat.hi{border-color:var(--cane)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font-size:22px;font-weight:600;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink-2);margin-top:2px}

/* admin */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.subtabs button{background:none;border:1px solid transparent;border-radius:8px;padding:7px 12px;color:var(--ink-2);font-weight:500}
.subtabs button.on{background:var(--card);border-color:var(--line-strong);color:var(--ink)}
.tblwrap{overflow-x:auto;max-width:100%}
table.tbl input,table.tbl select{background:var(--card);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;min-height:34px;width:100%;font-size:13.5px}
table.tbl td.n{width:1%;white-space:nowrap}
.inactive td{color:var(--ink-3)}
.tag{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11.5px;background:var(--grey-soft);color:var(--ink-2)}
.tag.on{background:var(--cane-soft);color:var(--cane)}
.tag.off{background:var(--red-soft);color:var(--red)}
.cred{background:var(--amber-soft);border:1px solid var(--amber);border-radius:8px;padding:12px 14px;font-size:14px;margin-top:10px}
.cred code{font-size:15px;font-weight:600}

/* dialog */
dialog.dlg{border:0;border-radius:12px;padding:0;max-width:640px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.dlg::backdrop{background:rgba(0,0,0,.45)}
dialog.dlg .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
dialog.dlg .db{padding:16px 18px;max-height:70vh;overflow:auto;font-size:14.5px;line-height:1.6}
dialog.dlg .db p{margin-bottom:12px}
.consent{background:var(--teal-soft);border:1px solid var(--teal);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.55;max-height:200px;overflow:auto;color:var(--ink)}
.consent h4{margin:0 0 6px;font-size:14px;color:var(--teal)}
.bankcode{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 12px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--card-2);color:var(--ink-2)}
.bankcode b{color:var(--ink);font-size:16px}
.readonly{background:var(--card-2)!important;color:var(--ink-2)}
.flag{display:inline-flex;align-items:center;gap:6px;background:var(--red-soft);color:var(--red);border-radius:8px;padding:4px 10px;font-size:13px}
.ok{color:var(--cane)}
.srv{font-size:12px;color:var(--ink-3);text-align:center;padding:16px 0 4px}
</style>

<script>
(function(){
'use strict';

/* =========================================================

const API_URL = 'https://script.google.com/macros/s/AKfycbzbqTIH_iEWZeqyYvFGKTVr7rxKBSbn1DSZekcuDMb-c6VFtQg7ECU2DYUkyMOkMNlU/exec';
const APP_VERSION = '2.0';

/* ---------- constants ---------- */
const ROLE_DEFS = {
  scout:   {label:'Field scout',    desc:'Captures farmer, field polygon, bank details and consent in the field'},
  checker: {label:'Data checker',   desc:'Verifies submissions and pushes them to the ERP'},
  permits: {label:'Permit officer', desc:'Opens the permit in the ERP, records its number and CCS clips'},
  zoning:  {label:'Zoning (GIS)',   desc:'Quality-checks the polygon and confirms zone, CBC and linear distance'},
  admin:   {label:'Administrator',  desc:'Manages users, harvesters, CBCs, banks and settings'},
};
const ALL_ROLES = ['scout','checker','permits','zoning'];
const STATUS = {
  submitted:    {label:'Awaiting data check',     tone:'amber', step:1},
  returned:     {label:'Returned for correction', tone:'red',   step:1},
  rejected:     {label:'Rejected',                tone:'grey',  step:1},
  pushed:       {label:'Pushed to ERP',           tone:'blue',  step:2},
  permit_issued:{label:'Permit issued',           tone:'teal',  step:3},
  zoned:        {label:'Zoned',                   tone:'green', step:4},
};
const STEPS = ['Captured','Pushed to ERP','Permit issued','Zoned'];
const ICON = {
  home:'<svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 20V9l6-5 6 5v11"/><path d="M10 20v-6h4v6"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><rect x="4" y="4" width="16" height="16" rx="3"/></svg>',
  permit:'<svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6"/><path d="M9 14h6M9 18h6"/></svg>',
  zone:'<svg viewBox="0 0 24 24"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  cog:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  cam:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  id:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.5-1.5 1.7-2 3-2s2.5.5 3 2M14 10h4M14 14h4"/></svg>',
  card:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  gps:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  refresh:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>',
};
const TABS = [
  {id:'capture', label:'My entries',  roles:['scout'],   icon:ICON.home},
  {id:'check',   label:'Data check',  roles:['checker'], icon:ICON.check},
  {id:'permits', label:'Permits',     roles:['permits'], icon:ICON.permit},
  {id:'zoning',  label:'Zoning',      roles:['zoning'],  icon:ICON.zone},
  {id:'board',   label:'All entries', roles:['*'],       icon:ICON.list},
  {id:'admin',   label:'Admin',       roles:['admin'],   icon:ICON.cog},
];
const DEFAULT_TERMS = 'I, {NAME} of ID no. {ID} hereby give an undertaking and warrant that the land which I intend to contract with the Miller for cane farming is free from any encumbrances, third party claims, rights or interests and or dispute(s) prejudicial to the Miller. I confirm that I have not contracted the said piece of land/sugarcane with any other Miller. I am aware that the Miller’s decision to enter into contract with me shall be based on my representations herein and that I shall indemnify the Miller for any loss and/or damage it may sustain by acting on my representations.';
const DEFAULT_PRIVACY = 'This application is committed to protecting your personal data in accordance with the Data Protection Act, 2019, Kenya’s primary statute on data protection, which gives effect to Article 31(c) and (d) of the Constitution of Kenya, 2010, guaranteeing every person’s right to privacy. Section 25 of the Act requires that personal data collected through this app is processed lawfully, fairly, and transparently, for specified and legitimate purposes, and kept accurate and up to date. We collect only the data necessary to deliver the app’s functionality, and we do not retain it longer than is reasonably required. Where applicable, we provide a privacy notice at or before the point of data collection, clearly stating the purpose of processing, the categories of data collected, retention periods, your rights as a data subject, and details of any cross-border transfers. Any processing of sensitive personal data generally requires your explicit consent. As required by the Act, we maintain appropriate technical and organizational safeguards to secure your data, and we are subject to oversight by the Office of the Data Protection Commissioner (ODPC), which enforces compliance, including a requirement to notify affected parties of any data breach within 72 hours. You retain the right to access, correct, delete, or restrict the processing of your personal data at any time, and may lodge a complaint with the ODPC if you believe your data has been mishandled.';
const DEFAULT_CONFIG = {
  zones:['A','B','C','D','E','F'], zoneIntervalKm:3, acreageUnit:'acres',
  areas:[], sublocations:[], termsText:DEFAULT_TERMS, termsVersion:'1', privacyText:DEFAULT_PRIVACY, privacyVersion:'1',
  bankAcctExactLength:true, requireBankCard:true, requireHarvester:true,
};
const IMG_KINDS = [['idFront','ID front'],['idBack','ID back'],['farmerPhoto','Farmer photo'],['bankCard','Bank card'],['signature','Signature']];

/* ---------- state ---------- */
const S = {
  token:null,me:null,config:null,cbcs:[],harvesters:[],banks:[],users:[],entries:[],
  loaded:false,view:'list',tab:null,detailId:null,draft:null,
  imgCache:{},boardFilter:'all',boardQuery:'',adminTab:'users',busy:false,
  lastSync:null,pollT:null,serverOffset:0,
};

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowISO = ()=>new Date().toISOString();
function fmt(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function fmtD(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function n2(x,dp){ if(x==null||x===''||isNaN(Number(x))) return '—'; return Number(x).toFixed(dp==null?2:dp); }
let toastT=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3000); }
function errMsg(e){ return (e&&e.message)?e.message:String(e); }
function uid(){ return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
function initials(name){ return String(name||'?').trim().split(/\s+/).slice(0,2).map(s=>s[0]||'').join('').toUpperCase()||'?'; }
function myRoles(){ if(!S.me) return []; const r=Array.isArray(S.me.roles)?S.me.roles:[]; return r.includes('admin')?['admin'].concat(ALL_ROLES):r.filter(x=>ALL_ROLES.includes(x)); }
const hasRole = x=>myRoles().includes(x);
const isAdmin = ()=>hasRole('admin');
function visibleTabs(){ return TABS.filter(t=>t.roles.includes('*')||t.roles.some(r=>hasRole(r))); }
function statusOf(e){ return STATUS[e.status]||{label:e.status||'Unknown',tone:'grey',step:0}; }
function chip(e){ const s=statusOf(e); return '<span class="chip t-'+s.tone+'">'+esc(s.label)+'</span>'; }
function rail(e,mini){
  const st=statusOf(e); const step=st.step; const halt=(e.status==='returned'||e.status==='rejected');
  let h='<div class="rail'+(mini?' mini':'')+'" aria-label="'+esc(st.label)+'">';
  STEPS.forEach((lbl,i)=>{ const n=i+1; let cls='stop'; if(n<=step) cls+=(halt&&n===step)?' halt':' done'; else if(n===step+1) cls+=' cur'; h+='<div class="'+cls+'"><div class="dot"></div><div class="lbl">'+esc(lbl)+'</div></div>'; });
  return h+'</div>';
}
function userName(u){ if(!u) return '—'; const x=S.users.find(y=>y.username===u); return x?x.name:u; }
function who(u){ return u?esc(userName(u)):'<span class="faint">—</span>'; }
function cfg(){ return S.config||DEFAULT_CONFIG; }
function activeCbcs(){ return S.cbcs.filter(c=>c.active!==false); }
function activeHarvesters(){ return S.harvesters.filter(h=>h.active!==false).slice().sort((a,b)=>String(a.name).localeCompare(String(b.name))); }
function activeBanks(){ return S.banks.filter(b=>b.active!==false).slice().sort((a,b)=>String(a.name).localeCompare(String(b.name))); }
function counts(list){
  const c={total:list.length,submitted:0,returned:0,rejected:0,pushed:0,permit_issued:0,zoned:0,withPermit:0};
  list.forEach(e=>{ if(c[e.status]!=null) c[e.status]++; if(e.permit&&e.permit.number) c.withPermit++; });
  return c;
}
function setHash(t){ try{ if(location.hash!=='#'+t) history.replaceState(null,'','#'+t); }catch(e){} }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }

/* ---------- geo ---------- */
const R_EARTH=6378137;
const rad=d=>d*Math.PI/180;
function haversineKm(a,b){ const dLat=rad(b[0]-a[0]),dLng=rad(b[1]-a[1]); const s=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2; return 2*6371.0088*Math.asin(Math.sqrt(s)); }
function geoAreaM2(pts){ // spherical excess approximation, pts = [[lat,lng],...]
  const n=pts.length; if(n<3) return 0; let a=0;
  for(let i=0;i<n;i++){ const p=pts[i],q=pts[(i+1)%n]; a+=(rad(q[1])-rad(p[1]))*(2+Math.sin(rad(p[0]))+Math.sin(rad(q[0]))); }
  return Math.abs(a*R_EARTH*R_EARTH/2);
}
function centroid(pts){
  const n=pts.length; if(!n) return null; if(n<3){ return [pts.reduce((s,p)=>s+p[0],0)/n,pts.reduce((s,p)=>s+p[1],0)/n]; }
  let A=0,cx=0,cy=0; // planar shoelace in lat/lng (fields are small)
  for(let i=0;i<n;i++){ const p=pts[i],q=pts[(i+1)%n]; const f=p[1]*q[0]-q[1]*p[0]; A+=f; cx+=(p[1]+q[1])*f; cy+=(p[0]+q[0])*f; }
  if(Math.abs(A)<1e-12) return [pts.reduce((s,p)=>s+p[0],0)/n,pts.reduce((s,p)=>s+p[1],0)/n];
  A*=0.5; return [cy/(6*A),cx/(6*A)];
}
function zoneFor(km){
  const c=cfg(); const letters=(c.zones&&c.zones.length)?c.zones:DEFAULT_CONFIG.zones; const step=Number(c.zoneIntervalKm)||3;
  if(km==null||isNaN(km)) return {zone:'',out:false,maxKm:letters.length*step};
  const idx=Math.max(0,Math.ceil(km/step)-1);
  if(idx>=letters.length) return {zone:'Beyond '+letters[letters.length-1],out:true,maxKm:letters.length*step};
  return {zone:letters[idx],out:false,maxKm:letters.length*step,from:idx*step,to:(idx+1)*step};
}
function computeGeo(pts){
  const r={areaM2:0,acres:0,ha:0,centroid:null,nearestCbc:'',nearestKm:null,zone:'',zoneOut:false};
  if(!pts||pts.length<3) return r;
  r.areaM2=geoAreaM2(pts); r.ha=r.areaM2/10000; r.acres=r.areaM2/4046.8564224; r.centroid=centroid(pts);
  let best=null;
  activeCbcs().forEach(c=>{ if(c.lat==null||c.lng==null) return; const km=haversineKm(r.centroid,[Number(c.lat),Number(c.lng)]); if(best==null||km<best.km) best={name:c.name,km:km}; });
  if(best){ r.nearestCbc=best.name; r.nearestKm=Math.round(best.km*100)/100; const z=zoneFor(best.km); r.zone=z.zone; r.zoneOut=z.out; }
  return r;
}
function acreageText(e){
  const u=cfg().acreageUnit;
  if(u==='ha') return n2(e.acreageHa!=null?e.acreageHa:(e.acreage!=null?e.acreage/2.4710538:null),2)+' ha';
  return n2(e.acreage,2)+' acres';
}

/* ---------- API ---------- */
async function api(action,data,opts){
  opts=opts||{};
  const payload=Object.assign({action:action,token:S.token||''},data||{});
  let res;
  try{ res=await fetch(API_URL,{method:'POST',body:JSON.stringify(payload),redirect:'follow'}); }
  catch(e){ throw new Error('No connection to the server. Check your network and try again.'); }
  let j; const txt=await res.text();
  try{ j=JSON.parse(txt); }catch(e){ throw new Error('Unexpected reply from the server. Check that API_URL is the /exec web app URL and that the script is deployed.'); }
  if(!j.ok){
    if(j.code==='AUTH'&&!opts.noAuthRedirect){ signOutLocal(); render(); }
    throw new Error(j.error||'Request failed');
  }
  if(j.serverTime){ S.serverOffset=new Date(j.serverTime).getTime()-Date.now(); }
  return j.data;
}
function signOutLocal(){ S.token=null; S.me=null; S.loaded=false; S.entries=[]; S.users=[]; S.view='list'; S.tab=null; S.detailId=null; S.draft=null; lsSet('cpt_token',null); clearInterval(S.pollT); }

/* ---------- boot ---------- */
async function boot(){
  if(!API_URL||API_URL.indexOf('PASTE_YOUR')===0||!/^https:\/\//.test(API_URL)){
    $('#main').innerHTML='<div class="setupnote"><div class="card"><h2>One more setup step</h2><p>This page is not yet connected to its backend. Open <code class="k">index.html</code>, find <code class="k">API_URL</code> near the top of the script, and paste the Apps Script <b>web app URL</b> (it ends in <code class="k">/exec</code>). See README.md for the full steps.</p></div></div>';
    return;
  }
  S.token=lsGet('cpt_token');
  if(S.token){
    try{ await loadAll(); }
    catch(e){ if(!S.token){ /* auth cleared */ } else toast(errMsg(e)); }
  }
  render();
  window.addEventListener('hashchange',()=>{ if(!S.loaded) return; const h=(location.hash||'').slice(1); const t=visibleTabs().find(x=>x.id===h); if(t&&t.id!==S.tab&&S.view!=='form'){ S.tab=t.id; S.view='list'; S.detailId=null; renderTabs(); render(); } });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.loaded) syncEntries(true); });
}
async function loadAll(){
  const d=await api('bootstrap');
  S.me=d.me; S.config=Object.assign({},DEFAULT_CONFIG,d.config||{});
  S.cbcs=d.cbcs||[]; S.harvesters=d.harvesters||[]; S.banks=d.banks||[]; S.users=d.users||[]; S.entries=d.entries||[]; S.lastSync=d.serverTime||nowISO();
  S.loaded=true;
  const tabs=visibleTabs(); const h=(location.hash||'').slice(1);
  S.tab=(tabs.find(t=>t.id===h)||tabs[0]||{id:null}).id;
  if(S.me.mustChange) S.view='password'; else S.view='list';
  clearInterval(S.pollT); S.pollT=setInterval(()=>{ if(!document.hidden) syncEntries(true); },90000);
}
async function syncEntries(quiet){
  if(!S.loaded||S.view==='form'||S.busy) return;
  try{
    const d=await api('entries',{since:S.lastSync});
    if(d.entries&&d.entries.length){
      const map=new Map(S.entries.map(e=>[e.id,e])); d.entries.forEach(e=>map.set(e.id,e));
      S.entries=[...map.values()].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
      if(S.view==='list'||S.view==='detail'){ renderTabs(); render(); }
    }
    S.lastSync=d.serverTime||S.lastSync;
    if(!quiet) toast('Up to date');
  }catch(e){ if(!quiet) toast(errMsg(e)); }
}

/* ---------- header / tabs ---------- */
function renderWho(){
  const w=$('#who');
  if(!S.me||!S.loaded){ w.innerHTML=''; w.hidden=true; return; }
  const rs=myRoles().filter(r=>r!=='admin').map(r=>ROLE_DEFS[r].label);
  const roleTxt=isAdmin()?'Administrator':(rs.length?rs.join(', '):'No role assigned yet');
  w.hidden=false;
  w.innerHTML='<span class="av" aria-hidden="true">'+esc(initials(S.me.name))+'</span><div style="min-width:0"><div class="n">'+esc(S.me.name||S.me.username)+'</div><div class="r">'+esc(roleTxt)+'</div></div>';
}
function toggleAcct(open){

  m.innerHTML='<div class="hd"><b>'+esc(S.me.name||'')+'</b>@'+esc(S.me.username)+'</div>'+
    '<button type="button" data-act="refresh">Refresh data</button>'+
    '<button type="button" data-act="password">Change password</button>'+
    '<button type="button" data-act="privacy">Data protection statement</button>'+
    '<button type="button" data-act="signout">Sign out</button>';
  document.body.appendChild(m);
  m.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-act]'); if(!b) return; const a=b.getAttribute('data-act'); toggleAcct(false);

async function doSignOut(){
  if(S.view==='form'&&!confirm('Sign out? The entry you are filling will be lost.')) return;

  signOutLocal(); renderWho(); renderTabs(); render();
}
function renderTabs(){
  const nav=$('#tabs');
  if(!S.loaded||!S.me||S.view==='password'){ nav.innerHTML=''; return; }
  const tabs=visibleTabs();
  nav.innerHTML=tabs.map(t=>{
    let badge=0;
    if(t.id==='check') badge=S.entries.filter(e=>e.status==='submitted').length;
    if(t.id==='permits') badge=S.entries.filter(e=>e.status==='pushed').length;
    if(t.id==='zoning') badge=S.entries.filter(e=>e.status==='permit_issued').length;
    if(t.id==='capture') badge=S.entries.filter(e=>e.createdBy===S.me.username&&e.status==='returned').length;
    return '<button type="button" data-tab="'+t.id+'" class="'+(S.tab===t.id?'on':'')+'">'+t.icon+'<span>'+esc(t.label)+'</span>'+(badge?'<span class="b num">'+badge+'</span>':'')+'</button>';

function bindPassword(){
  $('#p1Show').addEventListener('click',()=>{ const i=$('#p1'); i.type=i.type==='password'?'text':'password'; $('#p1Show').textContent=i.type==='password'?'Show':'Hide'; });

  $('#pwForm').addEventListener('submit',async ev=>{
    ev.preventDefault(); if(S.busy) return; const err=$('#pwErr'); err.textContent='';

    try{ await api('changePassword',{oldPassword:p0,newPassword:p1}); S.me.mustChange=false; toast('Password saved'); S.view='list'; renderWho(); renderTabs(); render(); }
    catch(e){ err.textContent=errMsg(e); b.disabled=false; b.textContent='Save password'; }

  });

/* ---------- render ---------- */
function render(){
  const m=$('#main'); destroyMaps();
  renderWho();
  if(!S.loaded||!S.me){ m.innerHTML=viewLogin(); bindLogin(); renderTabs(); return; }

  else if(S.view==='form'){ m.innerHTML=viewForm(); bindForm(); }

    const v={capture:viewCapture,check:viewCheck,permits:viewPermits,zoning:viewZoning,board:viewBoard,admin:viewAdmin}[S.tab];

async function loadImages(){
  const imgs=$$('img[data-img]:not([src])');

  }

function downloadGeoJSON(e){

function saveFile(text,name,type){ const b=new Blob([text],{type:type||'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }

const MAPS={};
function destroyMaps(){ Object.keys(MAPS).forEach(k=>{ const m=MAPS[k]; delete MAPS[k]; try{ m.stop(); }catch(e){} try{ m.remove(); }catch(e){} }); }
function later(id,fn){ setTimeout(()=>{ if(MAPS[id]) fn(MAPS[id]); },60); }
function baseLayers(){
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'});
  const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});
  return {Satellite:sat,Streets:osm};
}
function homeView(){ const c=activeCbcs().filter(x=>x.lat!=null); if(!c.length) return {center:[-1.05,34.65],zoom:11}; const la=c.reduce((s,x)=>s+Number(x.lat),0)/c.length,ln=c.reduce((s,x)=>s+Number(x.lng),0)/c.length; return {center:[la,ln],zoom:11}; }
function makeMap(id){
  if(typeof L==='undefined'){ const el=document.getElementById(id); if(el) el.innerHTML='<div class="center small">The map library could not load. Check the connection and reload.</div>'; return null; }
  const hv=homeView(); const layers=baseLayers();
  const m=L.map(id,{center:hv.center,zoom:hv.zoom,layers:[layers.Satellite],zoomControl:true,tap:false});
  L.control.layers(layers,null,{position:'topright'}).addTo(m);
  m.attributionControl.setPrefix('');
  MAPS[id]=m; return m;
}
function cbcMarkers(m,near){
  activeCbcs().forEach(c=>{ if(c.lat==null) return; L.marker([Number(c.lat),Number(c.lng)],{icon:L.divIcon({className:'',html:'<div class="cbcpin'+(c.name===near?' near':'')+'">'+esc(c.name)+'</div>',iconSize:[0,0]}),interactive:false,keyboard:false}).addTo(m); });
}
function showPolygonMap(id,pts,near){
  const m=makeMap(id); if(!m) return;
  const poly=L.polygon(pts.map(p=>[Number(p[0]),Number(p[1])]),{color:'#2E7D4F',weight:3,fillOpacity:.25}).addTo(m);
  cbcMarkers(m,near);
  const c=centroid(pts); const cb=activeCbcs().find(x=>x.name===near);
  if(c&&cb&&cb.lat!=null) L.polyline([c,[Number(cb.lat),Number(cb.lng)]],{color:'#B8701A',weight:2,dashArray:'6 6'}).addTo(m);
  const b=poly.getBounds(); if(cb&&cb.lat!=null) b.extend([Number(cb.lat),Number(cb.lng)]);
  m.fitBounds(b.pad(0.2),{animate:false});
  later(id,x=>x.invalidateSize());
}

function polyEditor(id){
  const d=S.draft; const m=makeMap(id); if(!m) return;

    const pts=st.markers.map(k=>{ const ll=k.getLatLng(); return [+ll.lat.toFixed(7),+ll.lng.toFixed(7)]; });
    d.polygon=pts;
    if(st.poly){ m.removeLayer(st.poly); st.poly=null; } if(st.line){ m.removeLayer(st.line); st.line=null; } if(st.link){ m.removeLayer(st.link); st.link=null; }
    if(pts.length>=3) st.poly=L.polygon(pts,{color:'#2E7D4F',weight:3,fillOpacity:.25,interactive:false}).addTo(m);
    else if(pts.length===2) st.line=L.polyline(pts,{color:'#2E7D4F',weight:3,dashArray:'4 6',interactive:false}).addTo(m);
    st.markers.forEach((k,i)=>k.setIcon(L.divIcon({className:'',html:'<div class="vtx'+(i===0?' first':'')+'"></div>',iconSize:[0,0]})));
    const g=computeGeo(pts); Object.assign(d,{geo:g});
    if(g.centroid&&g.nearestCbc){ const cb=activeCbcs().find(x=>x.name===g.nearestCbc); if(cb) st.link=L.polyline([g.centroid,[Number(cb.lat),Number(cb.lng)]],{color:'#B8701A',weight:2,dashArray:'6 6',interactive:false}).addTo(m); }
    if(!d.cbcTouched){ d.cbc=g.nearestCbc||d.cbc; const sel=$('#f_cbc'); if(sel&&g.nearestCbc){ sel.value=g.nearestCbc; } }
    delete d.errors.polygon; const box=$('#mapBox'); if(box) box.classList.remove('err');

  const addPt=(lat,lng)=>{

    k.on('drag',sync); k.on('dragend',sync);
    k.on('click',()=>{ if(!st.drawing&&confirm('Remove this corner?')){ m.removeLayer(k); st.markers=st.markers.filter(x=>x!==k); sync(); } });
    st.markers.push(k); sync();
  };
  st.addPt=addPt; st.sync=sync;
  m.on('click',ev=>{ if(st.drawing) addPt(ev.latlng.lat,ev.latlng.lng); });
  if(d.polygon&&d.polygon.length){ d.polygon.forEach(p=>addPt(Number(p[0]),Number(p[1]))); m.fitBounds(L.latLngBounds(d.polygon).pad(0.3),{animate:false}); }
  else if(navigator.geolocation){ navigator.geolocation.getCurrentPosition(p=>{ if(MAPS[id]) m.setView([p.coords.latitude,p.coords.longitude],17); },()=>{},{enableHighAccuracy:true,timeout:8000,maximumAge:60000}); }
  later(id,x=>x.invalidateSize());

function bindMapTools(){
  const d=S.draft; const st=PE; if(!st) return;
  const drawBtn=$('#mDraw'); const gpsBtn=$('#mGps'); const walkBtn=$('#mWalk');
  drawBtn.addEventListener('click',()=>{ st.drawing=!st.drawing; drawBtn.classList.toggle('on',st.drawing); st.m.getContainer().style.cursor=st.drawing?'crosshair':''; $('#polyHint').textContent=st.drawing?'Tap each corner of the field on the map. Tap “Tap corners” again when done. Drag a corner to adjust it; tap a corner to remove it.':'Choose how to capture the boundary: tap the corners on the satellite image, or walk the boundary adding your GPS position at each corner.'; });
  gpsBtn.addEventListener('click',()=>{
    if(!navigator.geolocation){ toast('GPS is not available on this device.'); return; }
    gpsBtn.disabled=true; gpsBtn.innerHTML='<span class="spin"></span>';
    navigator.geolocation.getCurrentPosition(p=>{ st.addPt(p.coords.latitude,p.coords.longitude); st.m.setView([p.coords.latitude,p.coords.longitude],Math.max(st.m.getZoom(),17)); toast('Corner added (±'+Math.round(p.coords.accuracy)+' m)'); gpsBtn.disabled=false; gpsBtn.innerHTML=ICON.gps+'Add GPS corner'; },
      err=>{ toast(err.code===1?'Location permission was refused.':'Could not get a GPS fix.'); gpsBtn.disabled=false; gpsBtn.innerHTML=ICON.gps+'Add GPS corner'; },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
  });
  walkBtn.addEventListener('click',()=>{
    if(!navigator.geolocation){ toast('GPS is not available on this device.'); return; }
    if(st.watch!=null){ navigator.geolocation.clearWatch(st.watch); st.watch=null; walkBtn.classList.remove('on'); walkBtn.textContent='Auto-walk'; return; }
    let last=null;
    st.watch=navigator.geolocation.watchPosition(p=>{ const here=[p.coords.latitude,p.coords.longitude]; if(p.coords.accuracy>25) return; if(last&&haversineKm(last,here)*1000<8) return; last=here; st.addPt(here[0],here[1]); st.m.setView(here,Math.max(st.m.getZoom(),17)); },()=>{},{enableHighAccuracy:true,maximumAge:0});
    walkBtn.classList.add('on'); walkBtn.textContent='Stop auto-walk'; toast('Walking the boundary: a corner is added every ~8 m. Tap again to stop.');
  });
  $('#mUndo').addEventListener('click',()=>{ const k=st.markers.pop(); if(k){ st.m.removeLayer(k); st.sync(); } });
  $('#mClear').addEventListener('click',()=>{ if(!st.markers.length||confirm('Clear the whole boundary?')){ st.markers.forEach(k=>st.m.removeLayer(k)); st.markers=[]; st.sync(); } });
  $('#mFit').addEventListener('click',()=>{ if(st.markers.length) st.m.fitBounds(L.latLngBounds(st.markers.map(k=>k.getLatLng())).pad(0.3)); else { const hv=homeView(); st.m.setView(hv.center,hv.zoom); } });
  $('#mImport').addEventListener('change',async ev=>{
    const f=ev.target.files&&ev.target.files[0]; if(!f) return;
    try{ const pts=await parseBoundaryFile(f); if(pts.length<3) throw new Error('No polygon found in that file.'); st.markers.forEach(k=>st.m.removeLayer(k)); st.markers=[]; pts.forEach(p=>st.addPt(p[0],p[1])); st.m.fitBounds(L.latLngBounds(pts).pad(0.3)); toast(pts.length+' corners imported'); }
    catch(e){ toast(errMsg(e)); }
    ev.target.value='';
  });
}
async function parseBoundaryFile(file){
  const text=await file.text(); const name=file.name.toLowerCase();
  const simplify=pts=>{ if(pts.length>2){ const a=pts[0],b=pts[pts.length-1]; if(a[0]===b[0]&&a[1]===b[1]) pts.pop(); } return pts; };
  if(name.endsWith('.geojson')||name.endsWith('.json')||text.trim()[0]==='{'){
    const j=JSON.parse(text); let geom=null;
    const walk=o=>{ if(!o||geom) return; if(o.type==='Polygon'||o.type==='MultiPolygon') geom=o; else if(o.geometry) walk(o.geometry); else if(o.features) o.features.forEach(walk); else if(o.geometries) o.geometries.forEach(walk); };
    walk(j); if(!geom) throw new Error('No polygon in that GeoJSON.');
    const ring=geom.type==='Polygon'?geom.coordinates[0]:geom.coordinates[0][0];
    return simplify(ring.map(c=>[Number(c[1]),Number(c[0])]));
  }
  const m=text.match(/<coordinates>([\s\S]*?)<\/coordinates>/i); // KML
  if(m){ return simplify(m[1].trim().split(/\s+/).map(t=>t.split(',')).filter(t=>t.length>=2).map(t=>[Number(t[1]),Number(t[0])])); }
  throw new Error('Use a GeoJSON or KML file.');
}

function bindPhotoInputs(root){
  const d=S.draft;
  root.querySelectorAll('.photo input[type=file]').forEach(inp=>inp.onchange=async()=>{
    const kind=inp.closest('.photo').getAttribute('data-kind'); const file=inp.files&&inp.files[0]; if(!file) return;
    try{ const blob=await compressImage(file,1200,0.78); d.images[kind]={blob:blob,preview:URL.createObjectURL(blob)}; delete d.errors[kind]; refreshPhoto(kind); }
    catch(e){ toast('That image could not be read. Try again.'); }
  });
  root.querySelectorAll('[data-retake]').forEach(b=>b.onclick=ev=>{ ev.preventDefault(); const k=b.getAttribute('data-retake'); delete d.images[k]; delete d.existingImages[k]; refreshPhoto(k); });
}
function refreshPhoto(kind){

  const label={idFront:'ID front',idBack:'ID back',farmerPhoto:'Farmer photo',bankCard:'Bank card / passbook'}[kind];

  const tmp=document.createElement('div'); tmp.innerHTML=photoTile(kind,label,cap,icon); const n=tmp.firstChild; tile.replaceWith(n); bindPhotoInputs(n.parentNode); loadImages();

function refreshSig(){ const wrap=document.querySelector('.sigwrap'); if(!wrap) return; wrap.outerHTML='<div class="sigwrap"><canvas class="sig" id="sigPad"></canvas><span class="ghost">Sign here with a finger or stylus</span><button type="button" class="btn sm clr" id="sigClear">Clear</button></div>'; setupSig(); }
function setupSig(){
  const c=$('#sigPad'); if(!c){ sig=null; return; }
  const dpr=Math.max(1,window.devicePixelRatio||1); const w=c.clientWidth||320,h=c.clientHeight||170;
  c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
  const ctx=c.getContext('2d'); ctx.scale(dpr,dpr); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#14233a';
  sig={c:c,ctx:ctx,drawn:false,down:false};
  const pos=ev=>{ const r=c.getBoundingClientRect(); return {x:ev.clientX-r.left,y:ev.clientY-r.top}; };
  c.addEventListener('pointerdown',ev=>{ ev.preventDefault(); c.setPointerCapture(ev.pointerId); sig.down=true; const p=pos(ev); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+0.1,p.y+0.1); ctx.stroke(); sig.drawn=true; const g=document.querySelector('.sigwrap .ghost'); if(g) g.style.display='none'; });
  c.addEventListener('pointermove',ev=>{ if(!sig.down) return; ev.preventDefault(); const p=pos(ev); ctx.lineTo(p.x,p.y); ctx.stroke(); });
  const up=()=>{ if(!sig.down) return; sig.down=false; ctx.closePath(); captureSig(); };
  c.addEventListener('pointerup',up); c.addEventListener('pointercancel',up); c.addEventListener('pointerleave',up);
  const clr=$('#sigClear'); if(clr) clr.addEventListener('click',()=>{ ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); sig.drawn=false; delete S.draft.images.signature; const g=document.querySelector('.sigwrap .ghost'); if(g) g.style.display=''; });
}
function captureSig(){ if(!sig||!sig.drawn) return; const preview=sig.c.toDataURL('image/png'); sig.c.toBlob(b=>{ if(b){ S.draft.images.signature={blob:b,preview:preview}; delete S.draft.errors.signature; } },'image/png'); }
function compressImage(file,maxDim,q){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ let w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,maxDim/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s); const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error('encode failed')),'image/jpeg',q); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('decode failed')); };
    img.src=url;
  });
}
function blobToDataUrl(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); }); }
function validate(d){
  const er={}; const c=cfg();
  if(!d.farmerName.trim()) er.farmerName='Enter the farmer’s name.';
  if(!d.phone.trim()) er.phone='Enter a phone number.';
  else if(!/^(\+?254|0)?[17]\d{8}$/.test(d.phone.replace(/[\s-]/g,''))) er.phone='Enter a valid Kenyan mobile number (e.g. 0712 345 678).';
  if(!d.idNumber.trim()) er.idNumber='Enter the ID number.';
  else if(!/^\d{6,10}$/.test(d.idNumber.trim())) er.idNumber='The ID number should be 6 to 10 digits.';
  if(c.requireHarvester!==false&&!d.harvesterCode) er.harvesterCode='Select the harvester.';
  if(!d.plotLR.trim()) er.plotLR='Enter the plot LR number.';
  if(!d.area.trim()) er.area='Enter the area.';
  if(!d.sublocation.trim()) er.sublocation='Enter the sublocation.';
  const g=computeGeo(d.polygon||[]);
  if(!d.polygon||d.polygon.length<3) er.polygon='Capture the field boundary with at least 3 corners.';
  else if(!(g.areaM2>50)) er.polygon='The polygon is too small — check the corners.';
  else if(g.areaM2>2000000) er.polygon='The polygon is larger than 200 ha — check the corners.';
  if(!d.cbc.trim()) er.cbc='Select the delivery CBC.';
  if(!d.bankCode) er.bankCode='Select the bank.';
  const bk=bankFor(d.bankCode); const acc=d.bankAccount.trim();
  if(!acc) er.bankAccount='Enter the account number.';
  else if(!/^\d+$/.test(acc)) er.bankAccount='Digits only.';
  else if(bk&&Number(bk.acctLength)>0){ const L=Number(bk.acctLength); if(c.bankAcctExactLength!==false?acc.length!==L:acc.length>L) er.bankAccount=bk.name+' account numbers have '+(c.bankAcctExactLength!==false?'':'up to ')+L+' digits (you entered '+acc.length+').'; }
  if(!d.bankAccountName.trim()) er.bankAccountName='Enter the account name.';
  if(!d.bankBranch.trim()) er.bankBranch='Enter the branch.';
  if(c.requireBankCard!==false&&!(d.images.bankCard||d.existingImages.bankCard)) er.bankCard='Take a photo of the bank card or passbook.';
  const missing=['idFront','idBack','farmerPhoto'].filter(k=>!(d.images[k]||d.existingImages[k]));
  if(missing.length){ er.photos='Add: '+missing.map(k=>({idFront:'ID front',idBack:'ID back',farmerPhoto:'farmer photo'})[k]).join(', ')+'.'; missing.forEach(k=>er[k]=true); }
  if(!d.consent) er.consent='Tick to confirm the farmer was informed and consents.';
  if(!d.agreed) er.agreed='Tick to confirm the farmer agrees to the undertaking.';
  if(!(d.images.signature||d.existingImages.signature)){ if(sig&&sig.drawn) captureSig(); else er.signature='Ask the farmer to sign.'; }
  return er;
}

    const entry={
      id:id,farmerName:d.farmerName.trim(),phone:d.phone.trim(),idNumber:d.idNumber.trim(),plotLR:d.plotLR.trim(),
      trips:d.trips===''?null:Number(d.trips),sublocation:d.sublocation.trim(),area:d.area.trim(),cbc:d.cbc.trim(),
      harvesterCode:d.harvesterCode,harvesterName:hv?hv.name:'',
      polygon:d.polygon,acreage:Math.round(g.acres*100)/100,acreageHa:Math.round(g.ha*1000)/1000,areaM2:Math.round(g.areaM2),
      centroidLat:g.centroid?+g.centroid[0].toFixed(7):null,centroidLng:g.centroid?+g.centroid[1].toFixed(7):null,
      nearestCbc:g.nearestCbc,nearestDistanceKm:g.nearestKm,zone:g.zone,zoneOut:!!g.zoneOut,
      bankCode:String(d.bankCode),bankName:bk?bk.name:d.bankName,bankAccount:d.bankAccount.trim(),bankAccountName:d.bankAccountName.trim(),bankBranch:d.bankBranch.trim(),
      images:images,
      agreedAt:(d.existing&&d.existing.agreedAt&&!d.images.signature)?d.existing.agreedAt:nowISO(),termsVersion:cfg().termsVersion||'1',
      privacyConsentAt:(d.existing&&d.existing.privacyConsentAt)||nowISO(),privacyVersion:cfg().privacyVersion||'1',
    };
    const r=await api('saveEntry',{entry:entry});
    applyUpdated(r.entry);
    toast(isEdit?'Resubmitted for data check':'Submitted for data check');
    S.draft=null; S.view='list'; S.detailId=null; sig=null; renderTabs(); render(); window.scrollTo(0,0);
  }catch(e){
    toast('Could not submit: '+errMsg(e)); btn.disabled=false; btn.textContent=d.id?'Resubmit for data check':'Submit for data check';
  }finally{ S.busy=false; }
}

  }));

  $$('[data-utoggle]').forEach(b=>b.addEventListener('click',()=>guard(async()=>{ const row=b.closest('tr'); const u=row.getAttribute('data-user'); const usr=S.users.find(x=>x.username===u); const act=usr.active===false; if(!act&&!confirm('Deactivate '+usr.name+'? They will not be able to sign in.')) return; const d=await api('updateUser',{username:u,active:act}); S.users=d.users; toast(act?'Reactivated':'Deactivated'); render(); })));
  $$('[data-ureset]').forEach(b=>b.addEventListener('click',()=>guard(async()=>{ const row=b.closest('tr'); const u=row.getAttribute('data-user'); const pw=genPw(); if(!confirm('Set a new temporary password for '+userName(u)+'?')) return; const d=await api('resetPassword',{username:u,tempPassword:pw}); S.users=d.users; render(); const r2=document.querySelector('tr[data-user="'+CSS.escape(u)+'"] .cred-slot'); if(r2) r2.innerHTML='<div class="cred">Temporary password for <b>'+esc(userName(u))+'</b>: <code>'+esc(pw)+'</code></div>'; })));

    const list=S.harvesters.concat([{code:code,name:name,phone:phone,idNumber:idNumber,active:true}]);
    const d=await api('saveList',{list:'harvesters',rows:list}); S.harvesters=d.rows; toast(name+' onboarded'); render();
  }));
  const hq=$('#hQ'); if(hq) hq.addEventListener('input',()=>{ const q=hq.value.trim().toLowerCase(); $$('#hTable tbody tr').forEach(tr=>{ tr.style.display=!q||tr.textContent.toLowerCase().includes(q)||[...tr.querySelectorAll('input')].some(i=>i.value.toLowerCase().includes(q))?'':'none'; }); });
  $$('[data-hsave]').forEach(b=>b.addEventListener('click',()=>guard(async()=>{ const row=b.closest('tr'); const code=row.getAttribute('data-hcode'); const list=S.harvesters.map(h=>h.code===code?Object.assign({},h,{name:row.querySelector('[data-f=name]').value.trim(),phone:row.querySelector('[data-f=phone]').value.trim(),idNumber:row.querySelector('[data-f=idNumber]').value.trim()}):h); const d=await api('saveList',{list:'harvesters',rows:list}); S.harvesters=d.rows; toast('Saved'); })));
  $$('[data-htoggle]').forEach(b=>b.addEventListener('click',()=>guard(async()=>{ const row=b.closest('tr'); const code=row.getAttribute('data-hcode'); const list=S.harvesters.map(h=>h.code===code?Object.assign({},h,{active:h.active===false}):h); const d=await api('saveList',{list:'harvesters',rows:list}); S.harvesters=d.rows; render(); })));
  // cbcs & zones
  on('#zSaveCfg',()=>guard(async()=>{ const step=Number($('#zInt').value); const letters=$('#zLet').value.split(',').map(s=>s.trim()).filter(Boolean); if(!(step>0)||!letters.length){ toast('Enter a band width and at least one zone letter.'); return; } await saveConfig({zoneIntervalKm:step,zones:letters}); render(); }));

  on('#cSave',()=>guard(async()=>{ const rows=readCbcs().filter(c=>c.name); const bad=rows.find(c=>c.lat==null||c.lng==null||isNaN(c.lat)||isNaN(c.lng)||Math.abs(c.lat)>90||Math.abs(c.lng)>180); if(bad){ toast('Enter valid coordinates for '+bad.name+'.'); return; } const d=await api('saveList',{list:'cbcs',rows:rows}); S.cbcs=d.rows; toast('CBCs saved'); render(); }));
  // banks
  const readBanks=()=>$$('#bankTable tbody tr').map(tr=>({code:tr.querySelector('[data-f=code]').value.trim(),name:tr.querySelector('[data-f=name]').value.trim(),acctLength:Number(tr.querySelector('[data-f=acctLength]').value)||0,active:tr.querySelector('[data-f=active]').checked}));
  on('#bAdd',()=>{ S.banks=readBanks(); S.banks.push({code:'',name:'',acctLength:10,active:true}); render(); });
  $$('[data-bdel]').forEach(b=>b.addEventListener('click',()=>{ const tr=b.closest('tr'); const i=Number(tr.getAttribute('data-bi')); S.banks=readBanks(); if(confirm('Remove '+(S.banks[i].name||'this bank')+'?')){ S.banks.splice(i,1); render(); } }));
  on('#bSave',()=>guard(async()=>{ const rows=readBanks().filter(b=>b.name||b.code); const bad=rows.find(b=>!b.code||!b.name||!(b.acctLength>0)); if(bad){ toast('Every bank needs a code, a name and the account-number digit count.'); return; } const d=await api('saveList',{list:'banks',rows:rows}); S.banks=d.rows; toast('Banks saved'); render(); }));
  // settings
  on('#saveCfg',()=>guard(async()=>{ const lines=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean); await saveConfig({acreageUnit:$('#cfgUnit').value,bankAcctExactLength:$('#cfgExact').value==='1',requireBankCard:$('#cfgCard').checked,requireHarvester:$('#cfgHarv').checked,areas:lines('#cfgAreas'),sublocations:lines('#cfgSubs')}); }));
  on('#saveTerms',()=>guard(async()=>{ const t=$('#cfgTerms').value.trim(); if(!t.includes('{NAME}')||!t.includes('{ID}')){ toast('Keep {NAME} and {ID} in the text.'); return; } await saveConfig({termsText:t,termsVersion:$('#cfgTermsV').value.trim()||'1'}); }));
  on('#savePriv',()=>guard(async()=>{ const t=$('#cfgPriv').value.trim(); if(t.length<50){ toast('The statement looks too short.'); return; } await saveConfig({privacyText:t,privacyVersion:$('#cfgPrivV').value.trim()||'1'}); }));
  on('#exportCsv',exportCsv); on('#exportGeo',exportGeo);

async function saveConfig(patch){ const next=Object.assign({},S.config,patch); const d=await api('saveConfig',{config:next}); S.config=Object.assign({},DEFAULT_CONFIG,d.config||next); toast('Settings saved'); }
function exportCsv(){
  const cols=['id','status','farmerName','phone','idNumber','harvesterCode','harvesterName','plotLR','acreageAcres','acreageHa','areaM2','trips','area','sublocation','deliveryCbc','nearestCbc','nearestDistanceKm','zoneComputed','zoneOut','centroidLat','centroidLng','vertices','bankCode','bankName','bankAccount','bankAccountName','bankBranch','createdAt','createdBy','checkResult','checkedAt','checkedBy','erpRef','permitNumber','ccsClips','permitAt','permitBy','zoneFinal','cbcFinal','linearDistanceFinalKm','inspected','polygonQc','zonedAt','zonedBy','agreedTermsAt','termsVersion','privacyConsentAt','privacyVersion'];
  const g=v=>{ v=v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const rows=[cols.join(',')];
  S.entries.forEach(e=>{ const z=e.zoning||{},p=e.permit||{},c=e.check||{};
    rows.push([e.id,e.status,e.farmerName,e.phone,e.idNumber,e.harvesterCode,e.harvesterName,e.plotLR,e.acreage,e.acreageHa,e.areaM2,e.trips,e.area,e.sublocation,e.cbc,e.nearestCbc,e.nearestDistanceKm,e.zone,e.zoneOut?'yes':'',e.centroidLat,e.centroidLng,(e.polygon||[]).length,e.bankCode,e.bankName,e.bankAccount,e.bankAccountName,e.bankBranch,e.createdAt,e.createdBy,c.result,c.at,c.by,c.erpRef,p.number,p.ccsClips,p.at,p.by,z.zone,z.cbc,z.linearDistance,z.inspected?'yes':'',z.polygonQc?'yes':'',z.at,z.by,e.agreedAt,e.termsVersion,e.privacyConsentAt,e.privacyVersion].map(g).join(',')); });
  saveFile('\ufeff'+rows.join('\r\n'),'cane-permit-entries-'+new Date().toISOString().slice(0,10)+'.csv','text/csv');
}
function exportGeo(){
  const feats=S.entries.filter(e=>e.polygon&&e.polygon.length>=3).map(e=>{ const ring=e.polygon.map(p=>[Number(p[1]),Number(p[0])]); ring.push(ring[0]); return {type:'Feature',properties:{id:e.id,status:e.status,farmer:e.farmerName,idNumber:e.idNumber,plotLR:e.plotLR,acres:e.acreage,ha:e.acreageHa,deliveryCbc:e.cbc,nearestCbc:e.nearestCbc,distanceKm:e.nearestDistanceKm,zone:e.zone,zoneFinal:(e.zoning&&e.zoning.zone)||'',permit:(e.permit&&e.permit.number)||'',harvester:e.harvesterName,capturedAt:e.createdAt,capturedBy:e.createdBy},geometry:{type:'Polygon',coordinates:[ring]}}; });
  saveFile(JSON.stringify({type:'FeatureCollection',features:feats},null,1),'cane-permit-polygons-'+new Date().toISOString().slice(0,10)+'.geojson','application/geo+json');
}

  S.boardQuery=ev.target.value;
  const list=document.querySelector('#main .list, #main .empty'); if(!list) return;
  list.outerHTML=listOf(filteredBoard(),{showScout:true},'No entries match.'); bindList();
});

boot();
})();

</script>
